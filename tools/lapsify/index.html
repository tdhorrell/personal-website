<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tim's Tools">
    <title>Tim's Tools</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/lapsify.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <div class="logo">tim.</div>
        <nav class="main-nav">
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-menu">
                <li><a href="../../index.html">home</a></li>
            </ul>
        </nav>
    </header>

    <section id="lapsify" class="lapsify content">
        <h1>lapsify image tool</h1>
        <input type="file" id="upload" accept="image/*">

        <div class="comparison">
            <div>
                <h3>original</h3>
                <canvas id="originalCanvas" class="tool-canvas"></canvas>
            </div>
            <div>
                <h3>lapsified</h3>
                <canvas id="filteredCanvas" class="tool-canvas"></canvas>
            </div>
        </div>

        <button id="download">download updated image</button>
    </section>

    <section id="contact" class="contact content">
        <h2>contact</h2>
        <ul class="contact-links">
            <li><a href="https://github.com/tdhorrell" target="_blank" rel="noopener noreferrer">Github</a></li>
            <li><a href="https://www.linkedin.com/in/timothy-horrell" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
            <li><a href="mailto:td.horrell11@gmail.com">Email</a></li>
        </ul>
    </section>

    <footer class="site-footer">
        <p>&copy; 2025 Tim Horrell. All rights reserved.</p>
    </footer>

    <script src="lapsify.js"></script>
</body>
</html>
