<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tim's Tools">
    <title>tim's webtools</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/lapsify.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <div class="logo"><a href="../../index.html"></a>tim.</div>
        <nav class="main-nav">
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-menu">
                <li><a href="../../index.html">home</a></li>
            </ul>
        </nav>
    </header>

    <section id="lapsify" class="lapsify content">
        <h1>lapsify image tool</h1>
        
        <input type="file" id="hiddenInput" accept="image/*" style="display: none">

        <button id="initial-upload-button" class="lapsify-primary-button">
            select an image
        </button>

        <div class="editor-container">
            <div id="lapsify-comparison" class="lapsify-comparison hidden">
                <div class="lapsify-original-image">
                    <h3>original</h3>
                    <canvas id="originalCanvas" class="lapsify-canvas"></canvas>
                </div>
                <div class="lapsify-filtered-image">
                    <h3>lapsified</h3>
                    <canvas id="filteredCanvas" class="lapsify-canvas"></canvas>
                </div>
            </div>

            <div class="lapsify-actions hidden">
                <button id="download" class="lapsify-download-button">download</button>
                <button id="upload-new-button" class="lapsify-secondary-button">upload new</button>
                <a href="../../index.html" class="lapsify-home-button">
                    go home →
                </a>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <p>&copy; 2025 Tim Horrell. All rights reserved.</p>
    </footer>

    <script src="lapsify.js"></script>
</body>
</html>
